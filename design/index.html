<!doctype html>

<html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<head>
  <title>Design | Jason Ngo</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" type="text/css" href="../base.css" />
  <link rel="stylesheet" type="text/css" href="./index.css" />
</head>

<body>
  <hgroup id="introduction">
    <h1>Base Styles</h1>
    <p>not a design system; just internal references</p>
  </hgroup>

  <main id="content">
    <section>
      <h2>Responsive</h2>

      <section>
        <h3 class="subheader">Breakpoints</h3>

        <table id="breakpoints">
          <caption>
            for media queries
          </caption>

          <thead>
            <tr>
              <td>device</td>
              <td>min (px)</td>
              <td>max (px)</td>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>phone</td>
              <td>-</td>
              <td>480</td>
            </tr>

            <tr>
              <td>tablet</td>
              <td>481</td>
              <td>768</td>
            </tr>

            <tr>
              <td>laptop</td>
              <td>769</td>
              <td>1200</td>
            </tr>

            <tr>
              <td>desktop</td>
              <td>1201</td>
              <td>-</td>
            </tr>
          </tbody>
        </table>
      </section>
    </section>

    <hr />

    <section>
      <h2>Color</h2>

      <section>
        <h3 class="subheader">Blue</h3>

        <div class="color-palette">
          <div class="color" id="color-blue-1">Blue 1</div>
          <div class="color" id="color-blue-2">Blue 2</div>
          <div class="color" id="color-blue-3">Blue 3</div>
        </div>
      </section>

      <section>
        <h3 class="subheader">Brown</h3>

        <div class="color-palette">
          <div class="color" id="color-brown-1">Brown 1</div>
          <div class="color" id="color-brown-2">Brown 2</div>
          <div class="color" id="color-brown-3">Brown 3</div>
        </div>
      </section>

      <section>
        <h3 class="subheader">Gray</h3>

        <div class="color-palette">
          <div class="color" id="color-gray-1">Gray 1</div>
          <div class="color" id="color-gray-2">Gray 2</div>
          <div class="color" id="color-gray-3">Gray 3</div>
        </div>
      </section>
    </section>

    <hr />

    <section>
      <h2>Typography</h2>

      <div>TODO</div>
    </section>
  </main>
</body>

</html>
